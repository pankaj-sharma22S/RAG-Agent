services:

  frontend:
    build: ./ui
    ports:
      - "3000:3000"
    depends_on:
      - backend1


  backend1:
    build: ./app
    expose:
      - "8000"

    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:///./data/dev.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini/gemini-2.5-flash}
      - PRIMARY_PROVIDER=${PRIMARY_PROVIDER:-gemini}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-gemini}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-ollama/llama3.2:latest}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

    depends_on:
      - redis

    volumes:
      - ./app/data:/app/data


  backend2:
    build: ./app
    expose:
      - "8000"

    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:///./data/dev.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini/gemini-2.5-flash}
      - PRIMARY_PROVIDER=${PRIMARY_PROVIDER:-gemini}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-gemini}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-ollama/llama3.2:latest}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

    depends_on:
      - redis

    volumes:
      - ./app/data:/app/data


  backend3:
    build: ./app
    expose:
      - "8000"

    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=sqlite:///./data/dev.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini/gemini-2.5-flash}
      - PRIMARY_PROVIDER=${PRIMARY_PROVIDER:-gemini}
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-gemini}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-ollama/llama3.2:latest}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}

    depends_on:
      - redis

    volumes:
      - ./app/data:/app/data


  nginx:
    image: nginx:alpine

    ports:
      - "8000:8000"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro


  redis:
    image: redis:7-alpine

    ports:
      - "6379:6379"

    restart: always

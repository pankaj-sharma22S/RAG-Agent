name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    env:
      # Tests sign their own JWTs with this secret; no real keys are needed in CI.
      SUPABASE_JWT_SECRET: test_jwt_secret_key_1234567890123456
      GEMINI_API_KEY: dummy-key-for-ci
      LANGSMITH_TRACING: "false"
      DATABASE_URL: sqlite:///./data/ci.db
      CHROMA_PERSIST_DIRECTORY: ./data/ci_chroma
      REDIS_URL: redis://localhost:6379/0
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
          pip install pytest fakeredis httpx

      - name: Cache FastEmbed / HuggingFace models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            /tmp/fastembed_cache
          key: models-${{ runner.os }}-${{ hashFiles('app/requirements.txt') }}

      - name: Run tests
        run: pytest tests -v --ignore=tests/verify_langsmith_live.py

  frontend:
    name: Frontend lint & build (React + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: false
          tags: rag-agent-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          push: false
          tags: rag-agent-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Validate compose file
        run: docker compose config -q
        env:
          GEMINI_API_KEY: dummy-key-for-ci
